[project]
name = "precos-api"
version = "0.1.0"
description = "API independente para bases de preços de construção SINAPI e SICRO"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "py7zr>=0.22,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
precos-api = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
